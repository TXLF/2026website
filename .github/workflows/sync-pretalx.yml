name: Sync pretalx schedule

on:
  schedule:
    # 07:00 UTC daily (about 1am Central), well clear of the deploy workflow
    - cron: "0 7 * * *"
  workflow_dispatch:

# NOTE: the pull request step needs "Allow GitHub Actions to create and approve
# pull requests" enabled under Settings -> Actions -> General (repository or org).
# It is off by default, and without it this workflow fails on its first run.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-pretalx
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # the script is stdlib-only, so the runner's preinstalled python3 is enough
      - name: Sync from pretalx
        id: sync
        run: |
          {
            echo 'report<<SYNC_REPORT'
            python3 scripts/sync-pretalx.py
            echo SYNC_REPORT
          } >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: sync/pretalx-schedule
          base: main
          title: "Sync schedule from pretalx"
          commit-message: "Sync schedule from pretalx"
          delete-branch: true
          body: |
            Generated by `scripts/sync-pretalx.py` from the published
            [pretalx schedule](https://pretalx.com/txlf2026/schedule/).

            ```
            ${{ steps.sync.outputs.report }}
            ```

            Review the diff before merging -- unpublished pretalx changes never
            appear here, only what is live on the public schedule.
